# Auto-deploys the Spring Boot app to Elastic Beanstalk on every push to master - the AWS-native
# replacement for the auto-deploy Render did for free on every push. This workflow does NOT touch
# infrastructure (RDS, IAM, security groups, env vars, etc.) - that's still infra/terraform/, run
# by hand. This only ever builds the app bundle and points the existing Beanstalk environment at
# it, matching exactly what infra/terraform/package-beanstalk.sh + terraform apply used to do for
# a routine code-only change, minus the "someone has to remember to run it" part.
#
# Skips itself on changes that are only infra/docs (paths-ignore below) - those don't need a new
# app build, and re-running this workflow for them would just deploy byte-identical app code
# under a new version label for no reason.
#
# Authenticates via OIDC (infra/terraform/github-actions.tf) - no AWS access keys stored in this
# repo at all. The assumed role can only ever create app versions and update THIS ONE Beanstalk
# environment; it cannot touch RDS, IAM, or any other AWS resource.

name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [master]
    paths-ignore:
      - "infra/terraform/**"
      - "infra/lambdas/**"
      - "**.md"

permissions:
  id-token: write # required for OIDC's AssumeRoleWithWebIdentity
  contents: read

concurrency:
  # A second push while a deploy is still rolling out cancels the first, rather than the two
  # racing to update the same environment out of order.
  group: beanstalk-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::201333676681:role/bodhsea-notifications-github-deploy
  DEPLOY_BUCKET: bodhsea-notifications-lambda-artifacts-201333676681
  APP_NAME: bodhsea-notifications-app
  # The blue-green migration to LoadBalanced/HTTPS (infra/terraform/beanstalk.tf) replaced the
  # original "bodhsea-notifications-app-env" (SingleInstance, terminated) with this one via
  # swap-environment-cnames - this workflow's own IAM policy (github-actions.tf) was updated to
  # match at the time, but this literal string here got missed, so every deploy since kept trying
  # to update an environment that no longer exists (AccessDenied, since the IAM policy correctly
  # no longer grants access to the old name either) until this line caught up.
  ENV_NAME: bodhsea-notifications-app-env-lb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        # package-beanstalk.sh now runs the actual Maven build itself, here on the runner - not
        # on the target Beanstalk instance. A real deploy compiling on-instance (t3.micro, 1GB
        # RAM) overwhelmed it badly enough that its health agent stopped responding mid-build;
        # this runner has ~7GB RAM and exists for exactly this kind of work.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deploy bundle
        # Same script Terraform's own manual deploy path uses (infra/terraform/beanstalk.tf) -
        # one definition of "what actually ships", not a second copy of this logic living here.
        run: infra/terraform/package-beanstalk.sh

      - name: Deploy to Elastic Beanstalk
        run: |
          set -euo pipefail

          ZIP="infra/terraform/build/beanstalk-app.zip"
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          KEY="beanstalk/bodhsea-app-${MD5}.zip"
          # Content-hash key (same convention Terraform uses) so a re-deploy of identical code
          # overwrites the same S3 object instead of piling up duplicates; the version LABEL
          # below is what has to be unique per run, not the object key.
          #
          # GITHUB_RUN_ATTEMPT is required, not just RUN_NUMBER - a real failure on this
          # workflow's first run showed why: CreateApplicationVersion registers the version
          # label BEFORE it validates the S3 bundle, so a run that fails after that point (e.g.
          # the earlier missing-s3:GetObject bug) leaves that label permanently claimed in AWS.
          # "Re-run failed jobs" reuses the same RUN_NUMBER, so without RUN_ATTEMPT the retry
          # collides with its own failed predecessor's stale version record
          # ("Application Version ... already exists") instead of trying again cleanly.
          VERSION_LABEL="gha-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          aws s3 cp "$ZIP" "s3://${DEPLOY_BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$APP_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${DEPLOY_BUCKET},S3Key=${KEY}"

          aws elasticbeanstalk update-environment \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL"

          echo "Deployed $VERSION_LABEL - waiting for environment to finish rolling out..."
          aws elasticbeanstalk wait environment-updated \
            --environment-name "$ENV_NAME"
          # IMPORTANT: this wait only blocks until the environment leaves "Updating" status - it
          # does NOT mean the deploy succeeded. A failed rollout (e.g. a mid-deploy permissions
          # error) still leaves the environment in a terminal "Ready" state, just still pointed
          # at whatever version was live before - a real run did exactly this and the job's exit
          # code was 0 even though nothing had actually deployed. The explicit VersionLabel check
          # below is what actually catches that; wait alone is not a success signal.

          read -r LIVE_VERSION LIVE_HEALTH <<< "$(aws elasticbeanstalk describe-environments \
            --environment-names "$ENV_NAME" \
            --query "Environments[0].[VersionLabel,Health]" --output text)"
          echo "Environment is now running version '$LIVE_VERSION', health: $LIVE_HEALTH"

          if [ "$LIVE_VERSION" != "$VERSION_LABEL" ]; then
            echo "::error::Deploy did not take effect - environment is running '$LIVE_VERSION', expected '$VERSION_LABEL'. Check environment events for the real failure (aws elasticbeanstalk describe-events)."
            exit 1
          fi

          if [ "$LIVE_HEALTH" != "Green" ]; then
            echo "::warning::Deployed successfully but environment health is '$LIVE_HEALTH', not Green - worth checking manually."
          fi
