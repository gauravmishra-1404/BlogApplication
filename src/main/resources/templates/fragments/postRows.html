<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The repeated post-card markup, shared between postDashboard.html's initial render and
     PostController.postsFragment() (js/infiniteScroll.js's per-batch fetch), so both code paths
     produce identical rows instead of two copies drifting apart. data-has-next-page on the root
     lets the client read "is there another page" straight off the fetched fragment without a
     separate response header. -->
<th:block th:fragment="postRows">
    <div style="display:contents" th:attr="data-has-next-page=${hasNextPage}">
        <th:block th:each="item : ${posts}" th:with="post=${item.post}, repostedBy=${item.repostedBy}">
        <!-- Only populated by the "Following" feed (FollowingFeedController) - absent/empty
             everywhere else (the main dashboard feed), so this never renders there. Only ever
             attached to a post whose own author ISN'T someone the viewer follows - otherwise the
             post already reads as followed content without needing an explanation. Mutually
             exclusive with the repost tag below - a repost's own feed position already explains
             itself, it doesn't also need the "commented" annotation. -->
        <div class="feed-activity-tag" th:if="${repostedBy == null and postAnnotations != null and postAnnotations.containsKey(post.id)}"
             th:with="annotation=${postAnnotations.get(post.id)}">
            <svg class="icon" aria-hidden="true"><use href="#i-comment"/></svg>
            <span class="avatar-mini" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(annotation.commenter)}">
                <div th:replace="~{fragments/avatarContent :: content(${annotation.commenter}, ${annotation.commenter.name})}"></div>
            </span>
            <span th:text="${annotation.commenter.name} + ' commented'">Someone commented</span>
        </div>
        <!-- Repost attribution - same .feed-activity-tag shape as the "commented" tag above,
             just a repost icon + "reposted" instead. Renders above the ORIGINAL post's own card;
             ${post.author} below still resolves to the original author, never to repostedBy. -->
        <div class="feed-activity-tag" th:if="${repostedBy != null}">
            <svg class="icon" aria-hidden="true"><use href="#i-repost"/></svg>
            <span class="avatar-mini" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(repostedBy)}">
                <div th:replace="~{fragments/avatarContent :: content(${repostedBy}, ${repostedBy.name})}"></div>
            </span>
            <span th:text="${repostedBy.name} + ' reposted'">Someone reposted</span>
        </div>
        <a class="post-row" th:href="@{/post/viewPost(id=${post.id})}" th:data-open-post-modal="${post.id}">
            <h2 class="post-title" th:text="${post.title}">Post Title</h2>
            <div class="post-meta" th:with="viewCount=${viewCounts.get(post.id)} ?: 0, reaction=${postReactions.get(post.id)}, commentCount=${commentCounts.get(post.id)} ?: 0">
                <!-- Not a real <a> - this row is already one big <a>, and nesting another
                     interactive element inside it would split the card in two (see js/profileLinks.js). -->
                <span class="post-author-link" th:if="${post.user != null and post.user.username != null}"
                      role="link" tabindex="0" th:attr="data-profile-url=@{/profile/{u}(u=${post.user.username})}">
                    <span class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(post.user)}">
                        <div th:replace="~{fragments/avatarContent :: content(${post.user}, ${post.author})}"></div>
                    </span>
                    <span th:text="${post.author}">Author</span>
                </span>
                <span class="post-author" th:unless="${post.user != null and post.user.username != null}">
                    <span class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(post.user)}">
                        <div th:replace="~{fragments/avatarContent :: content(${post.user}, ${post.author})}"></div>
                    </span>
                    <span th:text="${post.author}">Author</span>
                </span>
                <span class="dot"></span>
                <span th:if="${post.updatedAt != null}"
                      th:text="${T(com.BlogApplication.Blog.util.TimeFormatter).relative(post.updatedAt)}"
                      th:title="${T(com.BlogApplication.Blog.util.TimeFormatter).absolute(post.updatedAt)}"></span>
                <span class="dot"></span>
                <span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(viewCount)} + ' ' + (${viewCount} == 1 ? 'view' : 'views')"></span>
                <span class="dot"></span>
                <span class="post-reactions">
                    <svg class="icon" aria-hidden="true"><use href="#i-thumbs-up"/></svg><span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(reaction != null ? reaction.likeCount : 0)}">0</span>
                    <svg class="icon" aria-hidden="true"><use href="#i-thumbs-down"/></svg><span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(reaction != null ? reaction.dislikeCount : 0)}">0</span>
                    <svg class="icon" aria-hidden="true"><use href="#i-comment"/></svg><span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(commentCount)}">0</span>
                    <span class="post-repost-count" th:with="repostCount=${repostCounts.get(post.id)} ?: 0" th:if="${repostCount > 0}">
                        <svg class="icon" aria-hidden="true"><use href="#i-repost"/></svg><span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(repostCount)}">0</span>
                    </span>
                    <!-- A real <button> nested inside this row's own open <a> - confirmed safe via
                         headless-Chrome DOM dump for the Follow feature's near-identical
                         .follow-row button, unlike nesting another <a>/<form> which does split
                         the parse tree (see fragments/shareMenu.html's own doc comment). -->
                    <button type="button" class="bookmark-toggle"
                            th:classappend="${bookmarkedPostIds != null and bookmarkedPostIds.contains(post.id)} ? ' saved' : ''"
                            th:attr="data-post-id=${post.id}, data-logged-in=${currentUser != null}"
                            aria-label="Save for later">
                        <span class="pop"></span>
                        <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
                    </button>
                    <div th:replace="~{fragments/shareMenu :: shareMenu(${post.id}, @{/post/viewPost(id=${post.id})}, ${post.title}, false, null, null)}"></div>
                </span>
            </div>
            <p class="post-excerpt" th:text="${post.excerpt}">Post content excerpt...</p>

            <!-- Compact feed-card gallery - single image full-width, 2-4 images as a mosaic
                 grid with a "+N" overlay past 4 (defensive - the compose dropzone caps uploads
                 at 4 images client-side, this just doesn't break if that's ever bypassed), or a
                 video's own poster frame with a play badge. Only ever ONE of these three
                 branches renders, matching composeModal.js's own "images OR one video, never
                 mixed" rule - post.media.size()==1 covers both "exactly one image" and "the one
                 video a post can have" in a single branch, since a poster-frame overlay is the
                 only thing that needs to tell those two apart. -->
            <div class="feed-gallery" th:if="${post.media != null and !post.media.isEmpty()}">
                <div class="gallery-single" th:if="${post.media.size() == 1}">
                    <img th:if="${post.media[0].mediaType == 'IMAGE'}" th:src="${post.media[0].mediaUrl}" alt="">
                    <span th:if="${post.media[0].mediaType == 'VIDEO'}" class="gallery-video-wrap">
                        <video th:src="${post.media[0].mediaUrl}" muted preload="metadata"></video>
                        <span class="g-play"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></span>
                    </span>
                </div>
                <div class="gallery-grid" th:if="${post.media.size() > 1}"
                     th:classappend="'count-' + ${post.media.size() > 4 ? 4 : post.media.size()}">
                    <div class="g-item" th:each="m, iter : ${post.media}" th:if="${iter.index < 4}"
                         th:classappend="${iter.index == 3 and post.media.size() > 4} ? ' more' : ''"
                         th:attr="data-more=${iter.index == 3 and post.media.size() > 4} ? ('+' + (${post.media.size()} - 4)) : null">
                        <img th:if="${m.mediaType == 'IMAGE'}" th:src="${m.mediaUrl}" alt="">
                        <video th:if="${m.mediaType == 'VIDEO'}" th:src="${m.mediaUrl}" muted preload="metadata"></video>
                    </div>
                </div>
            </div>

            <div class="post-tags">
                <span th:each="tag : ${post.tagList}" th:text="${tag.name}">Tag</span>
            </div>
        </a>
        </th:block>
    </div>
</th:block>
</body>
</html>
