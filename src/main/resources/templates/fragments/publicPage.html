<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared chrome for the public, logged-out info pages (privacy/terms/security/contact).
     They reuse landing.css wholesale rather than getting a stylesheet each - same voice, same
     single-theme deep-ocean ground, and one place to change it. The landing page itself keeps its
     own nav markup because it has section anchors these pages don't. -->

<head th:fragment="head(pageTitle, pageDescription)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title th:text="${pageTitle} + ' — Bodh Sea'">Bodh Sea</title>
    <meta name="description" th:content="${pageDescription}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/landing.css">
</head>

<nav th:fragment="nav" class="lp-nav on">
    <div class="wrap nav-in">
        <a class="brand" th:href="@{/}">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 17c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 5-2" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
                <path d="M12 3c2.6 1.4 3.6 4.6 2.6 7.4-.7 2-2.6 3.6-2.6 3.6s-1.9-1.6-2.6-3.6C8.4 7.6 9.4 4.4 12 3Z" fill="#9ec2ff"/>
            </svg>
            Bodh Sea
        </a>
        <div class="nav-links">
            <a th:href="@{/privacy}">Privacy</a>
            <a th:href="@{/terms}">Terms</a>
            <a th:href="@{/security}">Security</a>
            <a class="btn btn-1 btn-sm" th:href="@{/registerUser}">Start free →</a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="lp-foot">
    <div class="wrap">
        <div class="foot-base" style="border-top:none">
            <p>© 2026 Bodh Sea</p>
            <div class="mini">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/privacy}">Privacy</a>
                <a th:href="@{/terms}">Terms</a>
                <a th:href="@{/security}">Security</a>
                <a th:href="@{/contact}">Contact</a>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
