<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Bodh Sea - View Post</title>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/viewPostByID.css">
    <script src="/js/commentThread.js" defer></script>
    <script src="/js/commentComposer.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <div class="post-actions" sec:authorize="isAuthenticated()"
         th:if="${#authorization.expression('hasRole(''ADMIN'')') or post.user.email==#authentication.name}">
        <a th:href="@{/posts/edit(id=${post.id})}" class="edit-button">
            <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>Edit</a>
        <form th:action="@{/posts/delete(id=${post.id})}" th:method="post">
            <button type="submit" class="delete-button">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Delete Post</button>
        </form>
    </div>

    <h1 class="blog-title" th:text="${post.title != null ? post.title : 'No Title'}">Blog Post Title</h1>
    <p class="blog-meta">
        Written by <span th:text="${post.author != null ? post.author : 'Unknown'}">Author Name</span> on
        <span th:if="${post.updatedAt != null}"
              th:text="${T(com.BlogApplication.Blog.util.TimeFormatter).relative(post.updatedAt)}"
              th:title="${T(com.BlogApplication.Blog.util.TimeFormatter).absolute(post.updatedAt)}">Date</span>
        <span th:if="${post.updatedAt == null}">Date not available</span>
    </p>
    <div class="blog-tags" th:if="${post.tags != null and !#strings.isEmpty(post.tags)}">
        <p><strong>Tags:</strong></p>
        <ul>
            <li th:each="tag : ${#strings.arraySplit(post.tags, ',')}"
                th:if="${!#strings.isEmpty(tag)}"
                th:text="${tag}">Tag Name</li>
        </ul>
    </div>
    <div class="blog-content" th:text="${post.content != null ? post.content : 'No content available.'}">
        Blog content goes here...
    </div>
</div>

<!-- Add Comment Section -->
<div class="comment-section">
    <h3>Add a Comment</h3>
    <div class="comment-composer" sec:authorize="isAuthenticated()">
        <div class="avatar" th:text="${currentUserName != null ? #strings.toUpperCase(#strings.substring(currentUserName, 0, 1)) : '?'}">T</div>
        <div class="composer-body">
            <form th:action="@{/posts/{id}/comments/add(id=${post.id})}" th:method="POST">
                <textarea name="content" class="composer-textarea" placeholder="Write your comment here..." required rows="1"></textarea>
                <div class="composer-actions">
                    <button type="submit" class="composer-submit" disabled>
                        <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Add Comment</button>
                </div>
            </form>
        </div>
    </div>
    <p sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Log in</a> to leave a comment.
    </p>
</div>

<!-- Display Existing Comments -->
<div class="comments-list">
    <h3>Comments</h3>
    <ul>
        <li th:each="comment : ${post.comments}" th:if="${comment.parent == null}">
            <div th:replace="~{fragments/commentNode :: commentNode(${comment})}"></div>
        </li>
    </ul>
</div>

</body>
</html>
