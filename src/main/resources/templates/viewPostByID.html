<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Bodh Sea - View Post</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/viewPostByID.css">
    <script src="/js/commentThread.js" defer></script>
    <script src="/js/commentComposer.js" defer></script>
    <script src="/js/reactions.js" defer></script>
    <script src="/js/bookmark.js" defer></script>
    <script src="/js/repost.js" defer></script>
    <script src="/js/share.js" defer></script>
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
    <script src="/js/postContent.js" defer></script>
    <script src="/js/mediaGallery.js" defer></script>
    <script src="/js/confirmDialog.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div th:replace="~{fragments/confirmDialog :: confirmDialog}"></div>

<div class="container">
    <div class="post-actions" sec:authorize="isAuthenticated()"
         th:if="${#authorization.expression('hasRole(''ADMIN'')') or post.user.email==#authentication.name}">
        <a th:href="@{/posts/edit(id=${post.id})}" class="edit-button">
            <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>Edit</a>
        <form th:action="@{/posts/delete(id=${post.id})}" th:method="post"
              data-confirm-title="Delete this post?"
              data-confirm-message="This can't be undone. It will be permanently removed from your profile and everyone's feed."
              data-confirm-label="Delete">
            <button type="submit" class="delete-button">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Delete Post</button>
        </form>
    </div>

    <h1 class="blog-title" th:text="${post.title != null ? post.title : 'No Title'}">Blog Post Title</h1>
    <p class="blog-meta">
        Written by <span th:text="${post.author != null ? post.author : 'Unknown'}">Author Name</span> on
        <span th:if="${post.updatedAt != null}"
              th:text="${T(com.BlogApplication.Blog.util.TimeFormatter).relative(post.updatedAt)}"
              th:title="${T(com.BlogApplication.Blog.util.TimeFormatter).absolute(post.updatedAt)}">Date</span>
        <span th:if="${post.updatedAt == null}">Date not available</span>
        <span class="blog-views">&middot; <span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(post.viewCount)}">0</span> <span th:text="${post.viewCount == 1 ? 'view' : 'views'}">views</span></span>
    </p>

    <div class="blog-tags" th:if="${post.tags != null and !#strings.isEmpty(post.tags)}">
        <p><strong>Tags:</strong></p>
        <ul>
            <li th:each="tag : ${#strings.arraySplit(post.tags, ',')}"
                th:if="${!#strings.isEmpty(tag)}"
                th:text="${tag}">Tag Name</li>
        </ul>
    </div>
    <div th:replace="~{fragments/postMediaGallery :: postMediaGallery}"></div>
    <div class="blog-content-wrap" id="blog-content-wrap">
        <div class="blog-content" id="blog-content" th:text="${post.content != null ? post.content : 'No content available.'}">
            Blog content goes here...
        </div>
    </div>

    <div class="post-footer-bar">
        <a class="post-author-chip" th:if="${post.user != null and post.user.username != null}"
           th:href="@{/profile/{u}(u=${post.user.username})}">
            <span class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(post.user)}">
                <div th:replace="~{fragments/avatarContent :: content(${post.user}, ${post.author})}"></div>
            </span>
            <span th:text="${post.author != null ? post.author : 'Unknown'}">Author Name</span>
        </a>
        <div class="post-author-chip" th:unless="${post.user != null and post.user.username != null}">
            <span class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(post.user)}">
                <div th:replace="~{fragments/avatarContent :: content(${post.user}, ${post.author})}"></div>
            </span>
            <span th:text="${post.author != null ? post.author : 'Unknown'}">Author Name</span>
        </div>

        <div class="reaction-bar" data-target-type="post" th:data-target-id="${post.id}"
             th:data-logged-in="${#authorization.expression('isAuthenticated()')}">
            <button type="button" class="reaction-btn" data-reaction="LIKE"
                    th:classappend="${postReaction.userReaction == 'LIKE'} ? ' active' : ''">
                <svg class="icon" aria-hidden="true"><use href="#i-thumbs-up"/></svg>
                <span class="reaction-count" th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(postReaction.likeCount)}">0</span>
            </button>
            <button type="button" class="reaction-btn" data-reaction="DISLIKE"
                    th:classappend="${postReaction.userReaction == 'DISLIKE'} ? ' active' : ''">
                <svg class="icon" aria-hidden="true"><use href="#i-thumbs-down"/></svg>
                <span class="reaction-count" th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(postReaction.dislikeCount)}">0</span>
            </button>
            <!-- Only on a published post - same reasoning bookmark's own th:if already has,
                 there's nothing public to repost yet on a draft/deleted post. Same toggle-pill
                 pattern as bookmark, own accent (repost-toggle.active) so it never reads as a
                 like/save. Repost count is the ORIGINAL post's own shared counter (see
                 RepostServiceImpl's own comment) - never a separate number for this repost. -->
            <button type="button" class="repost-toggle" th:if="${post.published}"
                    th:classappend="${isReposted} ? ' active' : ''"
                    th:attr="data-post-id=${post.id}, data-logged-in=${#authorization.expression('isAuthenticated()')}">
                <svg class="icon" aria-hidden="true"><use href="#i-repost"/></svg>
                <span class="repost-toggle-label" th:text="${isReposted} ? 'Reposted' : 'Repost'">Repost</span>
                <span class="reaction-count" th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(repostCount)}">0</span>
            </button>
            <button type="button" class="bookmark-toggle bookmark-pill" th:if="${post.published}"
                    th:classappend="${isBookmarked} ? ' saved' : ''"
                    th:attr="data-target-type=post, data-target-id=${post.id}, data-logged-in=${#authorization.expression('isAuthenticated()')}">
                <span class="pop"></span>
                <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
                <span class="bookmark-pill-label" th:text="${isBookmarked} ? 'Saved' : 'Save'">Save</span>
            </button>
            <div th:replace="~{fragments/shareMenu :: shareMenu(${post.id}, @{/post/viewPost(id=${post.id})}, ${post.title}, false, null, null)}"></div>
        </div>
    </div>
</div>

<!-- Add Comment Section -->
<div class="comment-section">
    <h3>Add a Comment</h3>
    <div class="comment-composer" sec:authorize="isAuthenticated()">
        <div class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(currentUser)}">
            <div th:replace="~{fragments/avatarContent :: content(${currentUser}, ${currentUser != null ? currentUser.name : null})}"></div>
        </div>
        <div class="composer-body">
            <form th:action="@{/posts/{id}/comments/add(id=${post.id})}" th:method="POST">
                <textarea name="content" class="composer-textarea" placeholder="Write your comment here..." required rows="1"></textarea>
                <div class="composer-actions">
                    <button type="submit" class="composer-submit" disabled>
                        <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Add Comment</button>
                </div>
            </form>
        </div>
    </div>
    <div class="comment-login-prompt" sec:authorize="isAnonymous()">
        <p>Join the conversation - sign in to leave a comment.</p>
        <a th:href="@{/login}" class="composer-submit">
            <svg class="icon" aria-hidden="true"><use href="#i-login"/></svg>Log in</a>
    </div>
</div>

<!-- Display Existing Comments -->
<div class="comments-list">
    <h3>Comments</h3>
    <ul>
        <li th:each="comment : ${post.comments}" th:if="${comment.parent == null and !comment.deleted}">
            <div th:replace="~{fragments/commentNode :: commentNode(${comment}, ${commentReactions})}"></div>
        </li>
    </ul>
</div>

</body>
</html>
