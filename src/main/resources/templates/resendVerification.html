<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodh Sea - Resend Verification</title>
    <link rel="stylesheet" th:href="@{/CSS/common.css}">
    <link rel="stylesheet" th:href="@{/CSS/authPage.css}">
</head>
<body>
<div class="ocean">
    <div class="brand-hero">
        <div class="icon-float">
            <div class="icon-wrap">
                <div class="echo-ring"></div>
                <div class="echo-ring"></div>
                <div class="echo-ring"></div>
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M24 6c-5 4-8 8-8 12 0 3.5 2.5 6 6 6h1v11"/>
                    <path d="M24 12c4 3 6.5 6 6.5 9 0 3-2 5-5 5"/>
                    <path d="M24 10c-3.5 2.5-6 5-6 7.5 0 2 1.5 3.5 3.5 3.5"/>
                    <path d="M5 36c3.5-2.5 7-2.5 10.5 0s7 2.5 10.5 0 7-2.5 10.5 0 7 2.5 10.5 0"/>
                </svg>
            </div>
        </div>
        <div class="word">Bodh Sea</div>
        <div class="tag">Set your thoughts adrift</div>
    </div>

    <div class="auth-card">
        <h2>Resend verification</h2>
        <p class="sub">Get a new email verification link</p>
        <div class="auth-success" th:if="${message}" th:text="${message}"></div>
        <form th:action="@{/resend-verification}" th:method="post">
            <div class="auth-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="auth-submit">Resend link</button>
        </form>
        <div class="auth-switch"><a th:href="@{/login}">Back to log in</a></div>
    </div>

    <div class="waves">
        <svg class="wave-back" viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,80 C240,140 480,20 720,60 C960,100 1200,20 1440,70 L1440,140 L0,140 Z"/>
        </svg>
    </div>
    <div class="waves">
        <svg class="wave-mid" viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,60 C200,110 420,10 700,50 C980,90 1200,30 1440,60 L1440,140 L0,140 Z"/>
        </svg>
    </div>
    <div class="waves">
        <svg class="wave-front" viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,90 C260,50 500,120 760,80 C1020,40 1240,100 1440,70 L1440,140 L0,140 Z"/>
        </svg>
    </div>
</div>
</body>
</html>
