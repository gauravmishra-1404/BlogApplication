<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodh Sea</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/dashboardStyle.css">
    <!-- Needed because the modal post view (fragments/postModal.html) reuses viewPostByID's own
         markup/classes and scripts wholesale instead of duplicating them. -->
    <link rel="stylesheet" href="/CSS/viewPostByID.css">
    <script src="/js/filterDropdown.js" defer></script>
    <script src="/js/share.js" defer></script>
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
    <script src="/js/profileLinks.js" defer></script>
    <script src="/js/dashboardFilterToggle.js" defer></script>
    <script src="/js/infiniteScroll.js" defer></script>
    <script src="/js/commentThread.js" defer></script>
    <script src="/js/commentComposer.js" defer></script>
    <script src="/js/reactions.js" defer></script>
    <script src="/js/bookmark.js" defer></script>
    <script src="/js/postModal.js" defer></script>
    <script src="/js/mediaGallery.js" defer></script>
    <script src="/js/composeModal.js" defer></script>
    <script src="/js/confirmDialog.js" defer></script>
    <script src="/js/toast.js" defer></script>
    <script src="/js/follow.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/icons :: defs}"></div>
<div th:replace="~{fragments/presetIcons :: defs}"></div>
<div th:replace="~{fragments/confirmDialog :: confirmDialog}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<div class="dashboard-shell">

    <!-- ============ LEFT: sidebar ============ -->
    <div th:replace="~{fragments/sidebar :: sidebar('home')}"></div>

    <!-- ============ CENTER: top bar + feed ============ -->
    <main class="center">
        <div class="topbar">
            <div class="crumb">Home / <b>For you</b></div>
            <div class="topbar-spacer"></div>
            <button type="button" class="chip-btn" id="filterToggleBtn" aria-expanded="false" aria-controls="filterPanel">
                <svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>Filter</button>
        </div>

        <div class="filter-panel-row" id="filterPanel" hidden>
            <div class="filter-sort-controls">
                <span class="filter-sort-label">Filter by</span>
                <form th:action="@{/home/filter-author}" th:method="get" class="filter-form">
                    <div th:replace="~{fragments/filterDropdown :: filterDropdown('Author', 'author', ${authors}, ${activeAuthors})}"></div>
                    <input type="hidden" name="query" th:value="${activeQuery}"/>
                    <input type="hidden" th:each="t : ${activeTags}" name="tag" th:value="${t}"/>
                    <input type="hidden" name="order" th:value="${activeOrder}"/>
                </form>
                <form th:action="@{/home/filter-tag}" th:method="get" class="filter-form">
                    <div th:replace="~{fragments/filterDropdown :: filterDropdown('Tag', 'tag', ${tags}, ${activeTags})}"></div>
                    <input type="hidden" name="query" th:value="${activeQuery}"/>
                    <input type="hidden" th:each="a : ${activeAuthors}" name="author" th:value="${a}"/>
                    <input type="hidden" name="order" th:value="${activeOrder}"/>
                </form>
                <span class="filter-sort-label">Sort by</span>
                <form th:action="@{/home/sort}" th:method="get" class="filter-form">
                    <select name="order" class="sort-dropdown" onchange="this.form.submit()">
                        <option value="">Newest first</option>
                        <option value="decrease" th:selected="${activeOrder == 'decrease'}">Newer To Older</option>
                        <option value="increase" th:selected="${activeOrder == 'increase'}">Older To Newer</option>
                    </select>
                    <input type="hidden" name="query" th:value="${activeQuery}"/>
                    <input type="hidden" th:each="a : ${activeAuthors}" name="author" th:value="${a}"/>
                    <input type="hidden" th:each="t : ${activeTags}" name="tag" th:value="${t}"/>
                </form>
            </div>
        </div>

        <div class="post-list" id="postList"
             th:attr="data-page-size=${pageSize}, data-query=${activeQuery}, data-authors=${#strings.listJoin(activeAuthors, '&#124;')}, data-tags=${#strings.listJoin(activeTags, '&#124;')}, data-order=${activeOrder}"
             th:data-next-page="${currentPage + 1}">
            <div th:replace="~{fragments/postRows :: postRows}"></div>
        </div>
        <!-- Purely a transient "fetch in progress" indicator (js/infiniteScroll.js) - hidden by
             default, shown only while a batch is actually loading, hidden again once it resolves
             regardless of whether there's a further page. No "you're all caught up" state at
             all: once there's nothing left, this simply never reappears. -->
        <div class="infinite-scroll-status" id="infiniteScrollStatus" hidden>
            <div class="leaf-loader" aria-label="Loading more posts" role="status">
                <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                    <circle cx="20" cy="20" r="16" fill="none" stroke="var(--color-border)" stroke-width="3"/>
                    <circle cx="20" cy="20" r="16" fill="none" stroke="url(#leafLoaderGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="28 101"/>
                </svg>
                <svg class="leaf" viewBox="-10 -13 20 26" aria-hidden="true">
                    <path d="M0,-11 C6,-8 8,0 6,7 C4,11 -4,11 -6,7 C-8,0 -6,-8 0,-11 Z" fill="url(#leafLoaderGradient)"/>
                </svg>
            </div>
        </div>
    </main>

    <!-- ============ RIGHT: real-data widgets ============ -->
    <div th:replace="~{fragments/rightSidebar :: rightSidebar}"></div>

    <button type="button" class="fab" id="composeFabBtn" aria-label="Write a post">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
    </button>

</div>

<!-- Modal post view (js/postModal.js) - empty until a post-row is clicked, which fetches
     GET /post/{id}/modal and injects fragments/postModal.html's markup here. Feed scroll
     position and loaded infinite-scroll batches are untouched by opening/closing this. -->
<div class="post-modal-backdrop" id="postModalBackdrop" hidden>
    <div class="post-modal-frame" id="postModalFrame"></div>
</div>

<!-- Compose modal (js/composeModal.js) - opened by the FAB above instead of navigating to
     /posts/createForm. Always inline (unlike the post-view modal above), since its content
     doesn't depend on which post was clicked - just the logged-in user, already in scope here. -->
<div th:replace="~{fragments/composeModal :: composeModal}"></div>

</body>
</html>
