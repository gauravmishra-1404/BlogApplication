<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodh Sea</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/dashboardStyle.css">
    <script src="/js/filterDropdown.js" defer></script>
    <script src="/js/share.js" defer></script>
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
    <script src="/js/profileLinks.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="filter-sort-container">
        <div class="filter-sort-controls">
            <span class="filter-sort-label">Filter by</span>

            <!-- Author Filter with Multiple Selection -->
            <form th:action="@{/posts/filter-author}" th:method="get" class="filter-form">
                <div th:replace="~{fragments/filterDropdown :: filterDropdown('Author', 'author', ${authors}, ${activeAuthors})}"></div>
                <input type="hidden" name="query" th:value="${activeQuery}"/>
                <input type="hidden" th:each="t : ${activeTags}" name="tag" th:value="${t}"/>
                <input type="hidden" name="order" th:value="${activeOrder}"/>
            </form>

            <form th:action="@{/posts/filter-tag}" th:method="get" class="filter-form">
                <div th:replace="~{fragments/filterDropdown :: filterDropdown('Tag', 'tag', ${tags}, ${activeTags})}"></div>
                <input type="hidden" name="query" th:value="${activeQuery}"/>
                <input type="hidden" th:each="a : ${activeAuthors}" name="author" th:value="${a}"/>
                <input type="hidden" name="order" th:value="${activeOrder}"/>
            </form>

            <span class="filter-sort-label">Sort by</span>
            <form th:action="@{/posts/sort}" th:method="get" class="filter-form">
                <select name="order" class="sort-dropdown" onchange="this.form.submit()">
                    <option value="">Newest first</option>
                    <option value="decrease" th:selected="${activeOrder == 'decrease'}">Newer To Older</option>
                    <option value="increase" th:selected="${activeOrder == 'increase'}">Older To Newer</option>
                </select>
                <input type="hidden" name="query" th:value="${activeQuery}"/>
                <input type="hidden" th:each="a : ${activeAuthors}" name="author" th:value="${a}"/>
                <input type="hidden" th:each="t : ${activeTags}" name="tag" th:value="${t}"/>
            </form>
        </div>
    </div>
    <div class="post-list">
        <a class="post-row" th:each="post : ${posts}" th:href="@{/post/viewPost(id=${post.id})}">
            <h2 class="post-title" th:text="${post.title}">Post Title</h2>
            <div class="post-meta" th:with="viewCount=${viewCounts.get(post.id)} ?: 0, reaction=${postReactions.get(post.id)}">
                <!-- Not a real <a> - this row is already one big <a>, and nesting another
                     interactive element inside it would split the card in two (see js/profileLinks.js). -->
                <span class="post-author-link" th:if="${post.user != null and post.user.username != null}"
                      role="link" tabindex="0" th:attr="data-profile-url=@{/profile/{u}(u=${post.user.username})}">
                    <span class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(post.user)}">
                        <div th:replace="~{fragments/avatarContent :: content(${post.user}, ${post.author})}"></div>
                    </span>
                    <span th:text="${post.author}">Author</span>
                </span>
                <span th:unless="${post.user != null and post.user.username != null}">
                    <span class="avatar" th:style="${T(com.BlogApplication.Blog.util.AvatarPresets).gradientStyle(post.user)}">
                        <div th:replace="~{fragments/avatarContent :: content(${post.user}, ${post.author})}"></div>
                    </span>
                    <span th:text="${post.author}">Author</span>
                </span>
                <span class="dot"></span>
                <span th:if="${post.updatedAt != null}"
                      th:text="${T(com.BlogApplication.Blog.util.TimeFormatter).relative(post.updatedAt)}"
                      th:title="${T(com.BlogApplication.Blog.util.TimeFormatter).absolute(post.updatedAt)}"></span>
                <span class="dot"></span>
                <span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(viewCount)} + ' ' + (${viewCount} == 1 ? 'view' : 'views')"></span>
                <span class="dot"></span>
                <span class="post-reactions">
                    <svg class="icon" aria-hidden="true"><use href="#i-thumbs-up"/></svg><span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(reaction != null ? reaction.likeCount : 0)}">0</span>
                    <svg class="icon" aria-hidden="true"><use href="#i-thumbs-down"/></svg><span th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(reaction != null ? reaction.dislikeCount : 0)}">0</span>
                    <div th:replace="~{fragments/shareMenu :: shareMenu(${post.id}, @{/post/viewPost(id=${post.id})}, ${post.title})}"></div>
                </span>
            </div>
            <p class="post-excerpt" th:text="${post.excerpt}">Post content excerpt...</p>
            <div class="post-tags">
                <span th:each="tag : ${post.tagList}" th:text="${tag.name}">Tag</span>
            </div>
        </a>
    </div>
    <div class="pagination-controls">
        <a class="pagination-button"
           th:if="${currentPage > 0}"
           th:href="@{/posts(page=${currentPage - 1}, size=${pageSize}, query=${activeQuery}, author=${activeAuthors}, tag=${activeTags}, order=${activeOrder})}">
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>Previous
        </a>
        <span th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">Page 1 of 10</span>
        <a class="pagination-button"
           th:if="${currentPage + 1 < totalPages}"
           th:href="@{/posts(page=${currentPage + 1}, size=${pageSize}, query=${activeQuery}, author=${activeAuthors}, tag=${activeTags}, order=${activeOrder})}">
            Next<svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </a>
    </div>
</main>

</body>
</html>
