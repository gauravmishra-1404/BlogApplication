<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Bookmarks - Bodh Sea</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/dashboardStyle.css">
    <link rel="stylesheet" href="/CSS/viewPostByID.css">
    <!-- Only for .shorts-tile-grid/.shorts-tile/etc. below - same reuse as draftsPage.html, built
         first for the profile page's own Shorts tab. -->
    <link rel="stylesheet" href="/CSS/profileStyle.css">
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
    <!-- Adaptive "More" overflow for this page's own mobile nav row - see the script's own
         comment for what it does; harmless no-op on desktop where .sidebar-more never shows. -->
    <script src="/js/sidebarMoreMenu.js" defer></script>
    <script src="/js/profileLinks.js" defer></script>
    <script src="/js/discoverToggle.js" defer></script>
    <script src="/js/share.js" defer></script>
    <script src="/js/commentThread.js" defer></script>
    <script src="/js/commentComposer.js" defer></script>
    <script src="/js/reactions.js" defer></script>
    <script src="/js/bookmark.js" defer></script>
    <script src="/js/repost.js" defer></script>
    <script src="/js/postModal.js" defer></script>
    <script src="/js/mediaGallery.js" defer></script>
    <script src="/js/composeModal.js" defer></script>
    <script src="/js/toast.js" defer></script>
    <script src="/js/confirmDialog.js" defer></script>
    <script src="/js/follow.js" defer></script>
    <script src="/js/loadMoreFeed.js" defer></script>
    <!-- Drives the Posts/Shorts .tab-bar below - same generic script draftsPage.html/profile.html use. -->
    <script src="/js/profileTabs.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/icons :: defs}"></div>
<div th:replace="~{fragments/presetIcons :: defs}"></div>
<div th:replace="~{fragments/confirmDialog :: confirmDialog}"></div>

<div class="dashboard-shell">

    <!-- ============ LEFT: sidebar ============ -->
    <div th:replace="~{fragments/sidebar :: sidebar('bookmarks')}"></div>

    <!-- ============ CENTER: feed ============ -->
    <main class="center">
        <div class="topbar">
            <div class="crumb">Home / <b>Bookmarks</b></div>
            <div class="topbar-spacer"></div>
            <!-- Mobile-only - see .discover-toggle-btn's own comment in dashboardStyle.css. -->
            <button type="button" class="chip-btn discover-toggle-btn" id="discoverToggleBtn" aria-expanded="false" aria-controls="discoverPanel">
                <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>Discover</button>
        </div>

        <div class="discover-panel-row" id="discoverPanel" hidden>
            <div th:replace="~{fragments/rightSidebar :: rightSidebar}"></div>
        </div>

        <!-- Posts/Shorts tab switcher - always rendered, even at 0/0 (each panel carries its own
             empty state below) rather than collapsing to one combined "No bookmarks yet" screen,
             same reasoning as draftsPage.html's own tabs (profileTabs.js drives both).
             No count badge on the Posts tab: unlike Drafts, ${posts} is only the current
             infinite-scroll page, not the full bookmarked-post total, so a number here would be
             misleading (and would go stale as more pages load). Shorts has a real total instead -
             ShortBookmarkRepo.findVisibleByUserId is a single, uncapped-enough fetch, not paginated.
             Default tab: Shorts only when this first Post page is empty and Shorts isn't. -->
        <div th:with="defaultShorts=${#lists.isEmpty(posts) and !#lists.isEmpty(shorts)}">
            <div class="tab-bar">
                <button type="button" class="tab-item" th:classappend="${!defaultShorts} ? ' active' : ''" data-tab="posts">Posts</button>
                <button type="button" class="tab-item" th:classappend="${defaultShorts} ? ' active' : ''" data-tab="shorts">
                    Shorts <span class="tab-count" th:text="${#lists.size(shorts)}">0</span>
                </button>
            </div>

            <div class="tab-panel" data-panel="posts" th:hidden="${defaultShorts}">
                <div class="post-list" id="bookmarksFeedList" data-load-more-list
                     th:unless="${#lists.isEmpty(posts)}"
                     data-load-more-button="bookmarksFeedLoadMore" data-load-more-url="/bookmarks/fragment"
                     th:data-next-page="${currentPage + 1}">
                    <div th:replace="~{fragments/postRows :: postRows}"></div>
                </div>
                <button type="button" class="load-more-btn" id="bookmarksFeedLoadMore" hidden>Load more</button>
                <div class="empty-hint" th:if="${#lists.isEmpty(posts)}">
                    <p>No bookmarked posts yet. Tap the bookmark icon on any post to save it here and read it later.</p>
                    <a th:href="@{/home}" class="cta-button">Explore posts</a>
                </div>
            </div>

            <!-- Bookmarked Shorts - previously a disclosed gap (ShortBookmarkRepo.findVisibleByUserId
                 existed but this page never called it, so a bookmarked Short saved fine but never
                 showed up here). Real <a> tiles, not role="button" - a bookmarked Short is published
                 and has a real /shorts/{id} URL, same markup as profile.html's own Shorts tab. -->
            <div class="tab-panel" data-panel="shorts" th:hidden="${!defaultShorts}">
                <div class="shorts-tile-grid" id="bookmarksShortsGrid" th:unless="${#lists.isEmpty(shorts)}">
                    <a class="shorts-tile" th:each="short : ${shorts}" th:href="@{/shorts/{id}(id=${short.id})}"
                       th:with="playbackUrl=${short.transcodedVideoUrl != null ? short.transcodedVideoUrl : short.videoUrl}">
                        <!-- onloadedmetadata nudges the browser to actually decode/paint a frame from the
                             raw video today, since thumbnailUrl stays null until the transcode pipeline
                             (Phase 2) is deployed - without it, preload="metadata" alone can leave the
                             tile visibly blank until someone plays it. -->
                        <video class="shorts-tile-video" th:src="${playbackUrl}" th:poster="${short.thumbnailUrl}"
                               muted preload="metadata" onloadedmetadata="this.currentTime=0.1"></video>
                        <!-- Reuses js/bookmark.js's existing generic .bookmark-toggle handling as-is
                             (already handles a nested button inside an <a> correctly - see
                             postRows.html's own identical comment) - "saved" unconditionally, since
                             every Short reaching this page is already bookmarked by definition.
                             js/bookmark.js additionally removes this tile from the grid on
                             un-bookmark, scoped to #bookmarksShortsGrid specifically so the exact
                             same button elsewhere (the Short's own page) never does that. -->
                        <button type="button" class="shorts-tile-badge bookmark-toggle saved"
                                th:attr="data-target-type=short, data-target-id=${short.id}, data-logged-in=${currentUser != null}"
                                aria-label="Remove bookmark">
                            <span class="pop"></span>
                            <svg class="icon" aria-hidden="true"><use href="#i-bookmark"/></svg>
                        </button>
                        <span class="shorts-tile-views"
                              th:with="viewCount=${shortViewCounts.get(short.id) != null ? shortViewCounts.get(short.id) : 0}"
                              th:text="${T(com.BlogApplication.Blog.util.NumberFormatter).compact(viewCount)} + (${viewCount == 1} ? ' view' : ' views')">0 views</span>
                        <span class="shorts-tile-caption" th:if="${short.caption != null and !#strings.isEmpty(short.caption)}"
                              th:text="${short.caption}">Caption</span>
                    </a>
                </div>
                <div class="empty-hint" th:if="${#lists.isEmpty(shorts)}">
                    <p>No bookmarked Shorts yet. Tap the bookmark icon on any Short to save it here and watch it later.</p>
                    <a th:href="@{/shorts}" class="cta-button">Explore Shorts</a>
                </div>
            </div>
        </div>
    </main>

    <!-- ============ RIGHT: real-data widgets ============ -->
    <div th:replace="~{fragments/rightSidebar :: rightSidebar}"></div>

</div>

<!-- Modal post view (js/postModal.js) - same as postDashboard.html's own. -->
<div class="post-modal-backdrop" id="postModalBackdrop" hidden>
    <div class="post-modal-frame" id="postModalFrame"></div>
</div>

<div th:replace="~{fragments/composeModal :: composeModal}"></div>

</body>
</html>
