<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Follow - Bodh Sea</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" href="/CSS/dashboardStyle.css">
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
    <!-- Adaptive "More" overflow for this page's own mobile nav row - see the script's own
         comment for what it does; harmless no-op on desktop where .sidebar-more never shows. -->
    <script src="/js/sidebarMoreMenu.js" defer></script>
    <script src="/js/follow.js" defer></script>
    <script src="/js/loadMoreFeed.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/icons :: defs}"></div>

<div class="dashboard-shell">

    <!-- ============ LEFT: sidebar ============ -->
    <div th:replace="~{fragments/sidebar :: sidebar('follow')}"></div>

    <!-- ============ CENTER: ranked directory ============ -->
    <main class="center">
        <div class="topbar">
            <div class="crumb">Home / <b>Follow</b></div>
        </div>

        <div class="follow-directory-list" data-load-more-list
             data-load-more-button="followDirectoryLoadMore" data-load-more-url="/follow/fragment"
             th:data-next-page="${currentPage + 1}">
            <div th:replace="~{fragments/followRows :: followRows}"></div>
        </div>

        <button type="button" class="load-more-btn" id="followDirectoryLoadMore" hidden>Load more</button>
    </main>

</div>

</body>
</html>
