<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodh Sea - Edit Post</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" th:href="@{/CSS/newPostStyle.css}">
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1>Edit Post</h1>
    <div class="auth-error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/post/republish}" th:method="post" th:object="${post}">
        <input type="hidden" th:field="*{id}" />
        <!-- Carries forward whatever the post's current publish state already is (true for an
             already-published post, false if this old page is somehow reached to edit a still-
             unpublished draft) - this form has no Save-Draft/Publish choice of its own, so it
             just preserves the state rather than risking silently publishing or unpublishing. -->
        <input type="hidden" th:field="*{published}" />
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" th:placeholder="|${post.title}|" required>
        </div>

        <div class="form-group">
            <label for="tags">Tags</label>
            <input type="text" id="tags" th:field="*{tags}" th:placeholder="|${post.tags}|" required>
        </div>

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" th:placeholder="|${post.author}|">
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" th:field="*{content}" rows="10" th:placeholder="|${post.content}|" required></textarea>
        </div>
        <!--        <a th:href="@{/posts/republish(id=${post.id})}" class="btn">Republish</a>-->
        <button type="submit" class="btn">Republish</button>
    </form>
</div>
</body>
</html>
