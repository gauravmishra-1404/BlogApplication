<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodh Sea - Login</title>
    <link rel="stylesheet" th:href="@{/CSS/common.css}">
    <link rel="stylesheet" th:href="@{/CSS/authPage.css}">
</head>
<body>
<div class="ocean">
    <div class="bubble" style="left:8%;  width:10px; height:10px; --drift:14px;  animation-duration:9s;  animation-delay:0s;"></div>
    <div class="bubble" style="left:18%; width:6px;  height:6px;  --drift:-10px; animation-duration:7s;  animation-delay:1.2s;"></div>
    <div class="bubble" style="left:30%; width:14px; height:14px; --drift:18px;  animation-duration:11s; animation-delay:2.1s;"></div>
    <div class="bubble" style="left:68%; width:8px;  height:8px;  --drift:-14px; animation-duration:8s;  animation-delay:0.6s;"></div>
    <div class="bubble" style="left:80%; width:12px; height:12px; --drift:10px;  animation-duration:10s; animation-delay:2.8s;"></div>
    <div class="bubble" style="left:90%; width:7px;  height:7px;  --drift:-8px;  animation-duration:6.5s;animation-delay:1.6s;"></div>
    <div class="bubble" style="left:50%; width:9px;  height:9px;  --drift:12px;  animation-duration:9.5s; animation-delay:3.4s;"></div>

    <div class="brand-hero">
        <div class="icon-float">
            <div class="icon-wrap">
                <div class="echo-ring"></div>
                <div class="echo-ring"></div>
                <div class="echo-ring"></div>
                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M24 4C15 14 10 22 10 28a14 14 0 0 0 28 0c0-5-3-9-7-13"/>
                    <path d="M24 9v18"/><path d="M24 16l-5 4"/><path d="M24 20l5 4"/><path d="M24 24l-4 3"/>
                    <path d="M14.5 29.5a6 6 0 0 1 9.5-4.5 4 4 0 0 1-1.5 7.3"/>
                    <path d="M6 37c3-2 6-2 9 0s6 2 9 0 6-2 9 0 6 2 9 0"/>
                </svg>
            </div>
        </div>
        <div class="word">Bodh Sea</div>
        <div class="tag">Thoughts, adrift and ashore</div>
    </div>

    <div class="auth-card">
        <h2>Welcome back</h2>
        <p class="sub">Log in to keep writing</p>
        <form th:action="@{/authenticateTheUser}" th:method="post">
            <div class="auth-field">
                <label for="username">Email</label>
                <input type="text" id="username" th:name="username" placeholder="you@example.com" required>
            </div>
            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" th:name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-submit">Log In</button>
        </form>
        <div class="auth-switch">New here? <a th:href="@{/registerUser}">Create an account</a></div>
    </div>

    <div class="waves">
        <svg class="wave-back" viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,80 C240,140 480,20 720,60 C960,100 1200,20 1440,70 L1440,140 L0,140 Z"/>
        </svg>
    </div>
    <div class="waves">
        <svg class="wave-mid" viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,60 C200,110 420,10 700,50 C980,90 1200,30 1440,60 L1440,140 L0,140 Z"/>
        </svg>
    </div>
    <div class="waves">
        <svg class="wave-front" viewBox="0 0 1440 140" preserveAspectRatio="none">
            <path fill="#ffffff" d="M0,90 C260,50 500,120 760,80 C1020,40 1240,100 1440,70 L1440,140 L0,140 Z"/>
        </svg>
    </div>
</div>
</body>
</html>
