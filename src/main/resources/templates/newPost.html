<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodh Sea - New Post</title>
    <script src="/js/themeInit.js"></script>
    <link rel="stylesheet" href="/CSS/common.css">
    <link rel="stylesheet" th:href="@{/CSS/newPostStyle.css}">
    <script src="/js/theme.js" defer></script>
    <script src="/js/navProfileMenu.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h1>Create a New Post</h1>
    <div class="auth-error" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/post/publish}" th:method="post" th:object="${postDto}">
        <!-- No draft option on this old standalone form - always a real publish, same as
             before PostServiceImpl.save() learned to check this flag. -->
        <input type="hidden" name="published" value="true">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" placeholder="Enter post title" required>
        </div>

        <div class="form-group">
            <label for="tags">Tags</label>
            <input type="text" id="tags" th:field="*{tags}" placeholder="Enter post tags (comma separated)" required>
        </div>

<!--        <div class="form-group">-->
<!--            <label for="author">Author</label>-->
<!--&lt;!&ndash;            <input type="text" id="author" th:field="*{author}" placeholder="Enter author name">&ndash;&gt;-->
<!--            <input type="text" id="author"-->
<!--                   th:field="${#authentication.principal.username}" readonly>-->
<!--        </div>-->

        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}"
                   th:attr="readonly=${role == 'ROLE_ADMIN' ? 'false' : 'true'}">



            <!--                        <input type="text" id="author" th:field="*{author}" readonly>-->
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" th:field="*{content}" rows="10" placeholder="Write your post here..." required></textarea>
        </div>

        <button type="submit" class="btn">Publish</button>
    </form>
</div>
</body>
</html>
