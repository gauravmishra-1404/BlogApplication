# Gmail SMTP - set MAIL_USERNAME/MAIL_PASSWORD as environment variables (MAIL_PASSWORD must be
# a Gmail "App Password", not the account password: https://myaccount.google.com/apppasswords).
# Left blank until those are set, sending will silently fail (logged, not crashed - see
# SmtpEmailService) rather than block registration/reset entirely.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
