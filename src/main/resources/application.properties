spring.application.name=Bodh Sea

# Render terminates HTTPS at its edge and forwards to this app over plain HTTP internally,
# adding X-Forwarded-Proto/X-Forwarded-Host headers to say the original request was HTTPS.
# Without this, Spring/Tomcat never see those headers and treat every request as insecure -
# affecting anything that keys off request.isSecure() (Spring Security's remember-me cookie
# among them, which decides its own Secure flag from that same signal when not explicitly
# set). Tell Spring to trust and parse the forwarded headers so the app knows requests are
# actually arriving over HTTPS, same as any app behind a reverse proxy needs.
server.forward-headers-strategy=framework

spring.jpa.open-in-view=true
# Database URL
spring.datasource.url=${DATASOURCE_URL:}
hibernate.transaction.jta.platform=org.hibernate.jta.platform.internal.SynchronizationRegistryBasedJtaPlatform

# Database Credentials
spring.datasource.username=${DATASOURCE_USERNAME:}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# Database Driver
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10

# Off in production - was logging every single SQL statement on every request, real overhead
# for zero benefit outside local debugging (application-docker.properties keeps it on for that).
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.security.user.name=admin
spring.security.user.password=admin123

# Used to build links in verification/reset emails - set APP_BASE_URL if the deployed
# hostname ever changes so emailed links don't point at the wrong place.
app.base-url=${APP_BASE_URL:https://blogapplication-2ncl.onrender.com}

# SendGrid HTTP API - Render blocks outbound SMTP entirely, so raw Gmail SMTP could never work
# here regardless of credentials; SendGrid's API runs over normal HTTPS instead. Set
# SENDGRID_API_KEY as an environment variable. SENDGRID_FROM_EMAIL defaults to the Single
# Sender identity verified in the SendGrid dashboard (Settings > Sender Authentication > Verify
# a Single Sender - no domain/DNS needed, just click the confirmation link SendGrid emails to
# that address). Left blank until the key is set, sending will silently fail (logged, not
# crashed - see SendGridEmailService) rather than block registration/reset.
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:bodhsea@gmail.com}

# Cloudinary - free-tier image hosting for profile pictures. Stays disabled (local-disk
# fallback, see LocalImageStorageService) until CLOUDINARY_ENABLED=true and the three
# credentials below are set as environment variables from a real Cloudinary account.
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# AWS SNS notification publisher (see services/impl/SnsNotificationPublisher.java) - stays
# disabled (LocalNotificationPublisher writes straight to the DB instead, no AWS involved)
# until AWS_SQS_ENABLED=true (property name predates the SNS layer - an internal implementation
# swap, not worth renaming and re-touching Render's env vars for) and AWS_SNS_TOPIC_ARN is set,
# from `terraform output sns_topic_arn` after infra/terraform has been applied (ask Claude for
# the deploy runbook). AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY also need to be set as plain
# environment variables (not Spring properties) - the AWS SDK's own default credential chain
# reads those two directly, same as any AWS SDK app; they should be the
# bodhsea-notification-service IAM user's keys, which only have sns:Publish on this one topic
# (see infra/terraform/iam.tf). The app no longer talks to any SQS queue URL directly - SNS
# fans a single published message out to whichever queues its filter policies match
# (infra/terraform/sns.tf), so the 3 AWS_SQS_*_QUEUE_URL env vars from before this change can be
# removed from Render whenever convenient (harmless to leave - just unread now).
aws.sqs.enabled=${AWS_SQS_ENABLED:false}
aws.region=${AWS_REGION:ap-south-1}
aws.sns.topic-arn=${AWS_SNS_TOPIC_ARN:}

# Post image/video upload (see services/impl/S3MediaUploadService.java) - stays disabled (the
# compose dropzone shows a "not available yet" state, see composeModal.js) until
# AWS_MEDIA_ENABLED=true and the bucket/CDN domain below are set. AWS_MEDIA_BUCKET is
# `terraform output media_bucket_name` after infra/terraform has been applied.
#
# AWS_MEDIA_CDN_DOMAIN is NOT a terraform output, and for now is NOT actually a CDN - CloudFront
# was refused on this AWS account (new-account fraud gate, no purchase history), and the
# Cloudflare-CDN replacement needs a domain name that hasn't been bought yet (bodhsea.in,
# deferred - see infra/terraform/media.tf's file comment for the full story). Until that domain
# exists, set AWS_MEDIA_CDN_DOMAIN directly to `terraform output media_bucket_regional_domain_name`
# (S3's own public endpoint - the bucket policy already makes posts/* publicly readable, so this
# works today, just with no edge caching). Swapping in the real CDN later is a single env var
# change and nothing else - the app only ever does `https://<this value>/posts/...`, it has no
# idea whether that's raw S3 or a Cloudflare-proxied hostname. Uses the SAME
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY as the notification system above (one app, one AWS
# credential pair, see infra/terraform/media.tf's own comment on why this isn't a second IAM
# user) - that identity now also has s3:PutObject scoped to this bucket's posts/* prefix only.
aws.media.enabled=${AWS_MEDIA_ENABLED:false}
aws.media.bucket=${AWS_MEDIA_BUCKET:}
aws.media.cdn-domain=${AWS_MEDIA_CDN_DOMAIN:}

# Shared session store (ElastiCache Redis, infra/terraform/redis.tf) - see SecurityConfig's own
# comment on why a single-instance in-memory SessionRegistry silently breaks the moment more
# than one app instance is running. Defaults to "none" (Spring Boot's own single-instance
# session handling, same as before this existed) if SPRING_SESSION_STORE_TYPE isn't set, so a
# production deploy that forgets to set it degrades safely rather than failing to start - it
# just goes back to not being safe to scale past 1 instance, exactly like today.
#
# No AUTH token / TLS in transit - the ElastiCache cluster only accepts inbound connections from
# the app instance's own security group (same VPC-and-security-group-only posture the RDS
# connection above already has, nothing stricter added here that isn't already true for the DB).
spring.session.store-type=${SPRING_SESSION_STORE_TYPE:none}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
