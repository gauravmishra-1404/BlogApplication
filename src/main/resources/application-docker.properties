spring.jpa.open-in-view=true

spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.security.user.name=admin
spring.security.user.password=admin123

app.base-url=http://localhost:8080
app.mail.enabled=false

# Explicit, not just relying on application.properties' own "none" default - spring-session-
# data-redis being on the classpath at all makes Spring Boot default store-type to "redis" the
# moment it's unset, which would make local `docker` profile try to connect to a Redis instance
# that doesn't exist here. No local Redis needed for local dev either way.
spring.session.store-type=none
