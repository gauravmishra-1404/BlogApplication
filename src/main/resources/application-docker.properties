spring.jpa.open-in-view=true

spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Explicit rather than relying on devtools' own dev-friendly defaults - with
# spring.devtools.restart.enabled=false (see this profile's own comment on why that's set),
# whether devtools still applies its usual "disable Thymeleaf caching" default became unclear in
# practice (a template edit stopped showing up without a restart). Setting it directly here
# removes that ambiguity for local dev, same reasoning as spring.jpa.show-sql=true above.
spring.thymeleaf.cache=false

spring.security.user.name=admin
spring.security.user.password=admin123

app.base-url=http://localhost:8080
app.mail.enabled=false

# spring.session.store-type is NOT a real property in this Spring Boot version (verified
# directly against spring-boot-autoconfigure 3.4.2's own compiled metadata - no such key exists,
# nothing gates on it) despite application.properties' own comment assuming it disables Redis
# session backing; it was silently a no-op there too. What actually decides whether Spring
# Session wires a Redis-backed SessionRepository is RedisSessionConfiguration's own
# @ConditionalOnBean(RedisConnectionFactory.class) - so the real fix for local dev is preventing
# that bean from ever being created, not a property that was never read. Excluding
# RedisAutoConfiguration here (docker profile only - production's real Redis is untouched) means
# no RedisConnectionFactory bean exists, so Spring Session falls through to no session-store
# configuration at all, i.e. the servlet container's own plain in-memory HttpSession - exactly
# what local single-instance dev needs, no local Redis required.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
