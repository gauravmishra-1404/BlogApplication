spring.jpa.open-in-view=true

spring.datasource.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.user.name=admin
spring.security.user.password=admin123

app.base-url=http://localhost:8080
app.mail.enabled=false

# Same reasoning as application-docker.properties - spring-session-data-redis being on the
# classpath defaults store-type to "redis" unless told otherwise, and no Redis exists in the
# test environment. This file fully replaces (not merges with) src/main/resources/
# application.properties for the test classpath, so this needs its own explicit copy of that
# override rather than inheriting it.
spring.session.store-type=none
